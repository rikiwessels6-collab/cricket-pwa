# Xcode project definition. Generate the project with:  xcodegen generate
# (brew install xcodegen). The .xcodeproj is not committed.
name: SteadyStrength
options:
  bundleIdPrefix: au.com.rwfitness
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en-AU
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SteadyCore:
    path: Packages/SteadyCore
targets:
  SteadyStrength:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources/Generated
        buildPhase: resources
        excludes: ["*.md"]
    dependencies:
      - package: SteadyCore
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Steady Strength
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Plum
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        NSCameraUsageDescription: Steady Strength uses the camera to scan food barcodes and, if you choose, photograph your plate.
        NSFaceIDUsageDescription: Steady Strength uses Face ID to keep your health and training data private on this iPhone.
        ITSAppUsesNonExemptEncryption: false
        HideUnreviewedContent: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.com.rwfitness.steadystrength
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  SteadyStrengthTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: SteadyStrength
      - package: SteadyCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: au.com.rwfitness.steadystrength.tests
  SteadyStrengthUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: SteadyStrength
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: au.com.rwfitness.steadystrength.uitests
schemes:
  SteadyStrength:
    build:
      targets:
        SteadyStrength: all
    test:
      targets:
        - SteadyStrengthTests
        - SteadyStrengthUITests
      gatherCoverageData: true
