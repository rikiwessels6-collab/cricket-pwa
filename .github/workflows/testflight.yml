name: TestFlight

# Builds the app on a GitHub Mac, signs it with your Apple account, and uploads
# it to TestFlight once the secrets below are saved.
# Start it by pushing to a branch called `testflight` (this repo's default
# branch has no workflows, so the Actions tab can't show a Run button).
on:
  workflow_dispatch:
  push:
    branches: [testflight]

# Only one TestFlight build at a time.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4   # builds exactly the commit this run was started from
      - name: Check the secrets are set
        env:
          A: ${{ secrets.APPLE_TEAM_ID }}
          B: ${{ secrets.ASC_KEY_ID }}
          C: ${{ secrets.ASC_ISSUER_ID }}
          D: ${{ secrets.ASC_KEY_P8 }}
        run: |
          m=""
          [ -n "$A" ] || m="$m APPLE_TEAM_ID"
          [ -n "$B" ] || m="$m ASC_KEY_ID"
          [ -n "$C" ] || m="$m ASC_ISSUER_ID"
          [ -n "$D" ] || m="$m ASC_KEY_P8"
          if [ -n "$m" ]; then echo "::error::Missing GitHub secrets:$m"; exit 1; fi
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Use Xcode 26 or newer (Apple requires the iOS 26 SDK for uploads)
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then
            echo "::error::No Xcode 26 or newer on this runner. Installed:"; ls /Applications | grep -i xcode; exit 1
          fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - run: brew install xcodegen && xcodegen generate
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          RELAY_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          set -o pipefail
          printf 'DEVELOPMENT_TEAM = %s\nCODE_SIGN_STYLE = Automatic\nPLATE_RELAY_TOKEN = %s\n' "$TEAM" "$(printf '%s' "$RELAY_TOKEN" | tr -d '[:space:]')" > Config/Local.xcconfig
          # Archive unsigned: an Apple account with no test devices can't make a development profile,
          # and TestFlight doesn't need one. The next step adds the app's entitlements (Apple Health),
          # then the export step signs for distribution.
          xcodebuild archive -project SteadyStrength.xcodeproj -scheme SteadyStrength \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SteadyStrength.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tee "$RUNNER_TEMP/archive.log" | tail -40
      - name: Add the entitlements to the archived app
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/SteadyStrength.xcarchive/Products/Applications/*.app | head -1)
          test -f Config/SteadyStrength.entitlements || { echo "::error::Config/SteadyStrength.entitlements was not generated"; exit 1; }
          # A plain codesign (not Xcode's build system) embeds the entitlements; export then re-signs for distribution.
          codesign --force --sign - --entitlements Config/SteadyStrength.entitlements "$APP"
      - name: Check the entitlements survived the archive
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/SteadyStrength.xcarchive/Products/Applications/*.app | head -1)
          codesign -d --entitlements - "$APP" > "$RUNNER_TEMP/ent.txt" 2>&1 || true
          cat "$RUNNER_TEMP/ent.txt"
          grep -q "com.apple.developer.healthkit" "$RUNNER_TEMP/ent.txt" || { echo "::error::The Apple Health entitlement is missing from the archive"; exit 1; }
      - name: Upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SteadyStrength.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
          echo "### Uploaded build ${{ github.run_number }} to TestFlight. It appears in the TestFlight app after Apple finishes processing (about 10-20 minutes)." >> "$GITHUB_STEP_SUMMARY"
