name: Deploy plate relay

on:
  workflow_dispatch:
  push:
    branches: [steady-strength]
    paths: ["relay/**", ".github/workflows/deploy-relay.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOK: ${{ secrets.APP_TOKEN }}
        run: |
          missing=""
          [ -n "$CF" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACC" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          [ -n "$TOK" ] || missing="$missing APP_TOKEN"
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: relay
      - run: npm test
        working-directory: relay
      - name: Deploy to Cloudflare and set secrets
        id: deploy
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          # Pasted secrets often carry stray spaces or line breaks; strip them.
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          ANTHROPIC_API_KEY="$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')"
          APP_TOKEN="$(printf '%s' "$APP_TOKEN" | tr -d '[:space:]')"
          if ! printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 letters/numbers (0-9, a-f); it is ${#CLOUDFLARE_ACCOUNT_ID} characters. Re-copy it from Workers & Pages."
            exit 1
          fi
          set -o pipefail
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "$APP_TOKEN" | npx wrangler secret put APP_TOKEN
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            if grep -q "register a workers.dev subdomain" deploy.log; then
              echo "::error::Cloudflare needs a workers.dev subdomain first: dash.cloudflare.com > Workers & Pages > set up a subdomain, then push again."
            fi
            exit 1
          fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::Deployed, but couldn't find the workers.dev URL in the output."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Relay URL: $URL"
      - name: Smoke test (no photo, no cost)
        env:
          URL: ${{ steps.deploy.outputs.url }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          APP_TOKEN="$(printf '%s' "$APP_TOKEN" | tr -d '[:space:]')"
          sleep 10
          bad=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/plate" -H 'x-app-token: wrong' -d '{}')
          good=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/v1/plate" -H "x-app-token: $APP_TOKEN" -H 'content-type: application/json' -d '{}')
          echo "wrong token -> $bad (want 401), right token -> $good (want 400: empty request)"
          [ "$bad" = 401 ] && [ "$good" = 400 ]
          echo "### Relay is live: $URL" >> "$GITHUB_STEP_SUMMARY"
