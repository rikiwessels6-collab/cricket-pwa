name: CI

on:
  push:
    branches: [steady-strength, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  importer:
    name: Program importer (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Regenerate and check the bundled JSON is up to date
        run: |
          python3 tools/importer/import_programs.py
          git diff --exit-code Resources/Generated
      - run: python3 -m unittest discover -s tools/importer

  ios:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: SteadyCore package tests
        run: swift test --package-path Packages/SteadyCore
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          ios = sorted((k for k in d if 'iOS' in k), key=lambda k: [int(x) for x in k.split('iOS-')[-1].split('-')])
          for k in reversed(ios):
              for dev in d[k]:
                  if dev['name'].startswith('iPhone'):
                      print(dev['udid']); sys.exit()
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project SteadyStrength.xcodeproj -scheme SteadyStrength \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|warning: .*SteadyStrength|Test Case .* (passed|failed)|\*\* (TEST|BUILD)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
